name: Pipeline DevSecOps CI/CD — EcoHuellitas Norte

on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main, test ]

jobs:
  # ==========================================
  # ETAPA 1 & 2: CONSTRUCCIÓN Y PRUEBAS AUTOMATIZADAS
  # ==========================================
  construccion-y-pruebas:
    name: 🏗️ Compilación y Pruebas Unitarias / Integración
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar código fuente del repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar entorno Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias del proyecto
        run: npm ci

      - name: 🧪 Ejecutar suite de pruebas con Jest y cobertura
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: devsecops-ci-secret-test-key

      - name: 📊 Publicar artefacto de cobertura de código
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-jest
          path: coverage/
          retention-days: 7

  # ==========================================
  # ETAPA 3 & 4: ANÁLISIS DE SEGURIDAD SHIFT-LEFT (SAST Y DEPENDENCIAS)
  # ==========================================
  seguridad-sast-y-dependencias:
    name: 🛡️ Análisis de Seguridad SAST y Auditoría SCA
    runs-on: ubuntu-latest
    needs: construccion-y-pruebas

    steps:
      - name: 📥 Descargar código fuente
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔍 Auditoría de dependencias npm (SCA)
        run: npm audit --audit-level=critical

      - name: 🔒 Escaneo de Secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ==========================================
  # ETAPA 5 & 6: DESPLIEGUE CONTINUO EN LA NUBE
  # ==========================================
  despliegue-nube:
    name: 🚀 Despliegue Automático en la Nube
    runs-on: ubuntu-latest
    needs: [construccion-y-pruebas, seguridad-sast-y-dependencias]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Descargar código fuente
        uses: actions/checkout@v4

      - name: 🌐 Notificación de Despliegue a Producción
        run: |
          echo "======================================================="
          echo "🚀 Despliegue completado exitosamente en la nube."
          echo "🐾 Plataforma: EcoHuellitas Norte v1.0.0"
          echo "📍 Distritos: Los Olivos | Comas | SMP | Independencia"
          echo "======================================================="
