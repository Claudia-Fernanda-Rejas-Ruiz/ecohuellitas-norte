name: Flujo Integrado DevSecOps y Verificacion de Despliegue - EcoHuellitas Norte

on:
  push:
    branches: [ "main", "test" ]
  pull_request:
    branches: [ "main", "test" ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # =========================================================================
  # FASE 1: CONSTRUCCION Y VALIDACION DE SINTAXIS (BUILD & LINT)
  # =========================================================================
  fase-1-construccion:
    name: Fase 1 - Construccion y Verificacion de Entorno
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio y codigo fuente
        uses: actions/checkout@v4

      - name: Configurar version de Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias limpias (npm ci)
        run: npm ci

      - name: Validar sintaxis y compilacion del proyecto
        run: node -c src/server.js src/app.js

  # =========================================================================
  # FASE 2: PRUEBAS AUTOMATIZADAS UNITARIAS Y DE INTEGRACION (TEST)
  # =========================================================================
  fase-2-pruebas-automatizadas:
    name: Fase 2 - Pruebas Automatizadas y Cobertura de Codigo
    runs-on: ubuntu-latest
    needs: fase-1-construccion

    steps:
      - name: Clonar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar suite completa de 24 pruebas con Jest
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: secreto-devsecops-pruebas-lima-norte-2026

      - name: Guardar reporte de cobertura como artefacto (LCOV)
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-pruebas
          path: coverage/
          retention-days: 7

  # =========================================================================
  # FASE 3: ANALISIS ESTATICO DE SEGURIDAD EN CODIGO FUENTE (SAST)
  # =========================================================================
  fase-3-analisis-sast:
    name: Fase 3 - Analisis Estatico de Seguridad SAST (Reglas OWASP)
    runs-on: ubuntu-latest
    needs: fase-2-pruebas-automatizadas

    steps:
      - name: Clonar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar motor de analisis estatico de seguridad en codigo fuente
        run: |
          echo "================================================================="
          echo "INICIANDO ANALISIS ESTATICO DE SEGURIDAD SAST - ECOHUELLITAS"
          echo "================================================================="
          node -e '
            const fs = require("fs");
            const path = require("path");

            let filesChecked = 0;
            let issuesFound = 0;

            function scanDirectory(dir) {
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              for (const entry of entries) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory() && entry.name !== "node_modules" && entry.name !== "coverage") {
                  scanDirectory(fullPath);
                } else if (entry.isFile() && entry.name.endsWith(".js")) {
                  filesChecked++;
                  const content = fs.readFileSync(fullPath, "utf-8");
                  
                  // Verificacion 1: Prohibicion de eval() dinamico
                  if (/\beval\s*\(/.test(content)) {
                    console.error("[SAST ERROR] Uso peligroso de eval() detectado en: " + fullPath);
                    issuesFound++;
                  }
                  
                  // Verificacion 2: Prohibicion de Function constructor dinamico
                  if (/\bnew\s+Function\s*\(/.test(content)) {
                    console.error("[SAST ERROR] Constructor Function() dinamico detectado en: " + fullPath);
                    issuesFound++;
                  }

                  // Verificacion 3: Evitar innerHTML o inyecciones directas en backend
                  if (/child_process\.exec\s*\(/.test(content)) {
                    console.error("[SAST WARNING] Uso de exec detectado en: " + fullPath);
                    issuesFound++;
                  }
                }
              }
            }

            scanDirectory("./src");
            console.log("Archivos inspeccionados en src/: " + filesChecked);
            console.log("Vulnerabilidades de inyeccion o codigo inseguro detectadas: " + issuesFound);
            
            if (issuesFound > 0) {
              process.exit(1);
            }
            console.log("Analisis SAST superado con exito. 0 vulnerabilidades criticas.");
          '

  # =========================================================================
  # FASE 4: ESCANEO Y DETECCION DE FUGA DE SECRETOS (SECRET SCANNING)
  # =========================================================================
  fase-4-deteccion-secretos:
    name: Fase 4 - Escaneo y Deteccion de Secretos (Gitleaks)
    runs-on: ubuntu-latest
    needs: fase-2-pruebas-automatizadas

    steps:
      - name: Clonar codigo fuente con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escaneo de llaves, tokens y credenciales con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # =========================================================================
  # FASE 5: AUDITORIA DE DEPENDENCIAS Y VULNERABILIDADES (SCA)
  # =========================================================================
  fase-5-auditoria-dependencias:
    name: Fase 5 - Auditoria de Vulnerabilidades en Dependencias (SCA)
    runs-on: ubuntu-latest
    needs: fase-2-pruebas-automatizadas

    steps:
      - name: Clonar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Auditoria de librerias de terceros (npm audit)
        run: npm audit --audit-level=critical

  # =========================================================================
  # FASE 6: EMPAQUETADO, SMOKE TEST Y SIMULACION DE DESPLIEGUE (DEPLOY READY)
  # =========================================================================
  fase-6-empaquetado-y-despliegue:
    name: Fase 6 - Empaquetado y Verificacion de Despliegue en Entorno de Pruebas
    runs-on: ubuntu-latest
    needs: [fase-1-construccion, fase-2-pruebas-automatizadas, fase-3-analisis-sast, fase-4-deteccion-secretos, fase-5-auditoria-dependencias]

    steps:
      - name: Clonar codigo fuente de la version
        uses: actions/checkout@v4

      - name: Configurar Node.js para empaquetado de produccion
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias solo de produccion
        run: npm ci --omit=dev

      - name: Generar artefacto comprimido de distribucion
        run: |
          mkdir -p dist
          tar --exclude='./dist' --exclude='./.git' --exclude='./coverage' --exclude='./tests' -czvf dist/ecohuellitas-norte-v1.0.0.tar.gz .

      - name: Ejecutar prueba de humo y verificacion de arranque (Smoke Test)
        run: |
          echo "Iniciando verificacion de arranque en entorno aislado..."
          export PORT=3099
          export JWT_SECRET=secreto-produccion-verificacion-2026
          node src/server.js &
          SERVER_PID=$!
          
          # Espera con reintentos para respuesta HTTP 200
          for i in {1..10}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3099/api/salubridad/resumen || true)
            echo "Intento $i: Codigo de respuesta recibido: $HTTP_STATUS"
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Prueba de humo superada exitosamente con codigo 200 en el intento $i."
              kill $SERVER_PID
              exit 0
            fi
            sleep 2
          done
          
          echo "Fallo en la prueba de humo del servicio de despliegue tras 10 intentos."
          kill $SERVER_PID 2>/dev/null || true
          exit 1

      - name: Publicar artefacto de despliegue generado
        uses: actions/upload-artifact@v4
        with:
          name: paquete-distribucion-despliegue
          path: dist/ecohuellitas-norte-v1.0.0.tar.gz
          retention-days: 14
